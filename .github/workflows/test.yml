name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: orderbook_test
          POSTGRES_USER: orderbook_user
          POSTGRES_PASSWORD: orderbook_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbook_user -d orderbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://orderbook_user:orderbook_password@localhost:5432/orderbook_test
    strategy:
      matrix:
        python-version:
          - "3.14.x"

    steps:
      - uses: actions/checkout@main

      - name: Switch to current branch
        run: git checkout ${{ env.BRANCH }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@main

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run Pyrefly
        run: uv run pyrefly check

      - name: Run tests with Pytest
        run: uv run coverage run --source=src/order_book_simulator/ -m pytest -v

      - name: Get code coverage report
        run: uv run coverage report -m
