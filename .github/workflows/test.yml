name: Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: orderbook_test
          POSTGRES_USER: orderbook_user
          POSTGRES_PASSWORD: orderbook_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderbook_user -d orderbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://orderbook_user:orderbook_password@localhost:5432/orderbook_test
    strategy:
      matrix:
        python-version:
          - "3.14.x"

    steps:
      - uses: actions/checkout@main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@main

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests with Pytest
        run: uv run coverage run --source=src/order_book_simulator/ -m pytest -v

      - name: Get code coverage report
        run: uv run coverage report -m

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14.x
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.x"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install project dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Run Docker Compose smoke and crash-recovery checks
        env:
          CHECK_STREAMLIT: "1"
          RUN_CRASH_RECOVERY: "1"
        run: uv run python scripts/docker_smoke_test.py

      - name: Dump Compose logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --timestamps --tail=200

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
