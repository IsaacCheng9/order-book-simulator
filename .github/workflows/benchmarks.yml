name: Benchmarks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14.x"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install the project
        run: uv sync --frozen --all-extras --dev

      - name: Start Docker Compose services
        run: docker compose up -d redis kafka

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping; do sleep 1; done'
          echo "Waiting for Kafka..."
          timeout 60 bash -c 'until docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null; do sleep 2; done'
          echo "Services ready"

      - name: Run unit benchmarks
        run: |
          set -euo pipefail
          echo "Commit: ${{ github.sha }}" | tee benchmark_results.txt
          echo "Date: $(date -u)" | tee -a benchmark_results.txt
          echo "" | tee -a benchmark_results.txt
          echo "=== Unit Benchmarks ===" | tee -a benchmark_results.txt
          uv run --no-project python benchmarks/unit/run_all_benchmarks.py | tee -a benchmark_results.txt

      - name: Run integration benchmarks
        run: |
          set -euo pipefail
          echo "" | tee -a benchmark_results.txt
          echo "=== Integration Benchmarks ===" | tee -a benchmark_results.txt
          uv run --no-project python benchmarks/integration/integration_benchmark.py | tee -a benchmark_results.txt

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results.txt
          retention-days: 90
